    --emerald:#1f7a5a; --card:#ffffff; --shadow:0 20px 50px -28px rgba(20,20,40,.4);
  }
  html.dark{
    --bg:#0c1226; --bg2:#121a34; --ink:#eef1fb; --ink2:#c3cde9; --muted:#8b97bb;
    --line:#222c4d; --lapis:#8fa9f4; --lapis2:#7f9bf0; --gold:#e2c072; --gold2:#caa858;
    --emerald:#54c39a; --card:#141d38; --shadow:0 20px 50px -26px rgba(0,0,0,.7);
  }
  *{-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;transition:background .4s,color .4s}
  .ar{font-family:'Amiri',serif;direction:rtl}
  .disp{font-family:'Marcellus',serif;font-weight:400}
  .ta{font-family:'Noto Sans Tamil',sans-serif}
  .hi{font-family:'Noto Sans Devanagari',sans-serif}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px}
  .btn{cursor:pointer;border:none;font-family:inherit;font-weight:600;transition:transform .18s,box-shadow .18s,background .2s}
  .btn:active{transform:scale(.97)}
  .pri{background:linear-gradient(135deg,var(--lapis2),var(--lapis));color:#fff;box-shadow:0 12px 26px -12px color-mix(in srgb,var(--lapis) 85%,transparent)}
  html.dark .pri{color:#0a1130}
  .ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
  .pill{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;font-weight:700}
  .pill.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2c05;border-color:transparent}
  .lcell{background:var(--card);border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:transform .16s,border-color .2s,box-shadow .2s}
  .lcell:hover{transform:translateY(-3px);border-color:var(--gold2);box-shadow:var(--shadow)}
  .lcell.done{border-color:color-mix(in srgb,var(--emerald) 55%,transparent)}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sheet{animation:sheet .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes sheet{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

  {c:'و',n:'Wāw',nt:'வாவ்',nh:'वाव',s:'w / ū',ex:'وَحْي',tr:'waḥy',e:'revelation',eta:'வெளிப்பாடு',ehi:'प्रकाशना (वह्य)'},
  {c:'ي',n:'Yā',nt:'யா',nh:'या',s:'y / ī',ex:'يَوْم',tr:'yawm',e:'day',eta:'நாள்',ehi:'दिन (यौम)'},
];

const HARAKAT = [
  {sym:'بَ',name:'Fatḥa',s:'"a" (as in cup)',de:'A small stroke above the letter → short "a".',dt:'எழுத்தின் மேல் ஒரு சிறு கோடு → குறு "a".',dh:'अक्षर के ऊपर एक छोटी रेखा → लघु "a"।'},
  {sym:'بِ',name:'Kasra',s:'"i" (as in sit)',de:'A small stroke below the letter → short "i".',dt:'எழுத்தின் கீழ் ஒரு சிறு கோடு → குறு "i".',dh:'अक्षर के नीचे एक छोटी रेखा → लघु "i"।'},
  {sym:'بُ',name:'Ḍamma',s:'"u" (as in put)',de:'A small "و" above the letter → short "u".',dt:'எழுத்தின் மேல் சிறிய "و" → குறு "u".',dh:'अक्षर के ऊपर छोटा "و" → लघु "u"।'},
  {sym:'بْ',name:'Sukūn',s:'no vowel',de:'A small circle → the letter has no vowel (a stop).',dt:'ஒரு சிறு வட்டம் → எழுத்துக்கு உயிரொலி இல்லை.',dh:'एक छोटा वृत्त → अक्षर पर कोई स्वर नहीं।'},
  {sym:'بّ',name:'Shadda',s:'double the letter',de:'A small "w" shape → the letter is doubled (stressed).',dt:'சிறிய "w" வடிவம் → எழுத்து இரட்டிப்பாகிறது.',dh:'छोटा "w" आकार → अक्षर दोगुना (बल के साथ)।'},
  {sym:'بً',name:'Tanwīn',s:'"-an / -in / -un"',de:'Double marks at a word’s end → an "n" sound (an/in/un).',dt:'வார்த்தையின் இறுதியில் இரட்டைக் குறிகள் → "n" ஒலி (an/in/un).',dh:'शब्द के अंत में दोहरे चिह्न → "n" ध्वनि (an/in/un)।'},
];

/* ─────────────── audio (Web Speech) ─────────────── */
function speak(text){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='ar-SA'; u.rate=.8;
    const v=(window.speechSynthesis.getVoices()||[]).find(x=>/ar/i.test(x.lang));
    if(v) u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function forms(c){ return { iso:c, ini:c+ZWJ, med:ZWJ+c+ZWJ, fin:ZWJ+c }; }

/* ─────────────── app ─────────────── */
function App(){
  const [lang,setLang]=useState(()=>localStorage.getItem('atLang')||'en');
  const [dark,setDark]=useState(()=>localStorage.getItem('atDark')==='1');
  const [tab,setTab]=useState('path');
  const [sel,setSel]=useState(null);
  const [done,setDone]=useState(()=>{ try{return new Set(JSON.parse(localStorage.getItem('atLearned')||'[]'))}catch(e){return new Set()} });
  const t=T[lang];
  const scr = lang==='ta'?'ta':lang==='hi'?'hi':'';

  useEffect(()=>{ localStorage.setItem('atLang',lang); },[lang]);
  useEffect(()=>{ localStorage.setItem('atDark',dark?'1':'0'); document.documentElement.classList.toggle('dark',dark); },[dark]);
  useEffect(()=>{ if(window.speechSynthesis) window.speechSynthesis.getVoices(); },[]);

  const nameOf = l => lang==='ta'?l.nt : lang==='hi'?l.nh : l.n;
  const meanOf = l => lang==='ta'?l.eta : lang==='hi'?l.ehi : l.e;
  const toggleDone = c => setDone(prev=>{ const n=new Set(prev); n.has(c)?n.delete(c):n.add(c); localStorage.setItem('atLearned',JSON.stringify([...n])); return n; });

  const NAV=[['path',t.path],['alphabet',t.alphabet],['vowels',t.vowels],['practice',t.practice]];

  return (
    <div className="min-h-screen">
      {/* header */}
      <header className="sticky top-0 z-40" style={{background:'color-mix(in srgb,var(--bg) 88%,transparent)',backdropFilter:'blur(10px)',borderBottom:'1px solid var(--line)'}}>
        <div className="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3">
          <div className="flex items-center gap-2.5 min-w-0">
            <div className="ar disp" style={{fontSize:26,color:'var(--gold)',lineHeight:1}}>ب</div>
            <div className="min-w-0">
              <div className={"disp truncate "+scr} style={{fontSize:18,color:'var(--ink)',lineHeight:1.05}}>Bayyinah <span style={{color:'var(--muted)'}}>· {t.brand}</span></div>
            </div>
          </div>
          <div className="ml-auto flex items-center gap-1.5">
            {['en','ta','hi'].map(k=>(
              <button key={k} onClick={()=>setLang(k)} className={"btn pill px-3 py-1.5 text-[12.5px] "+(k==='ta'?'ta':k==='hi'?'hi':'')+(lang===k?' on':'')}>{T[k].langname}</button>
            ))}
            <button onClick={()=>setDark(d=>!d)} className="btn pill px-2.5 py-1.5 text-[13px]" title="Day / Night">{dark?'☀️':'🌙'}</button>
          </div>
        </div>
        <div className="max-w-5xl mx-auto px-4 pb-2 flex gap-1 overflow-x-auto">
          {NAV.map(([k,label])=>(
            <button key={k} onClick={()=>setTab(k)} className={"btn px-3.5 py-1.5 rounded-full text-[13.5px] whitespace-nowrap "+scr+(tab===k?' pri':' ghost')}>{label}</button>
          ))}
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-4 py-6">
        {tab==='path' && <Path t={t} scr={scr} setTab={setTab} doneCount={done.size} total={L.length}/>}
        {tab==='alphabet' && <Alphabet t={t} scr={scr} L={L} nameOf={nameOf} done={done} onSel={setSel}/>}
        {tab==='vowels' && <Vowels t={t} scr={scr} lang={lang}/>}
        {tab==='practice' && <Practice t={t} scr={scr} L={L} nameOf={nameOf}/>}
      </main>

      {sel && <LetterSheet l={sel} t={t} scr={scr} nameOf={nameOf} meanOf={meanOf} done={done} toggleDone={toggleDone} onClose={()=>setSel(null)}/>}

      <footer className={"max-w-5xl mx-auto px-4 py-8 text-center text-[12.5px] "+scr} style={{color:'var(--muted)'}}>
        <div style={{borderTop:'1px solid var(--line)',paddingTop:16}}>{t.footer}</div>
      </footer>
    </div>
  );
}

function Card({children,className='',...p}){ return <div className={"card "+className} {...p}>{children}</div>; }

function Path({t,scr,setTab,doneCount,total}){
  const pct=Math.round(doneCount/total*100);
  const rows=[
    {k:'alphabet',n:'1',title:t.l1,d:t.l1d,go:t.start,active:true,tab:'alphabet'},
    {k:'vowels',n:'2',title:t.l2,d:t.l2d,go:t.start,active:true,tab:'vowels'},
    {k:'practice',n:'3',title:t.l3,d:t.l3d,go:t.review,active:true,tab:'practice'},
    {k:'words',n:'4',title:t.l4,d:t.l4d,soon:true},
    {k:'roots',n:'5',title:t.l5,d:t.l5d,soon:true},
  ];
  return (
    <div className="fade">
      <div className="text-center mb-7">
        <div className="ar" style={{fontSize:'clamp(30px,7vw,46px)',color:'var(--gold)'}}>بِسْمِ اللّٰهِ</div>
        <h1 className={"disp mt-2 "+scr} style={{fontSize:'clamp(24px,5vw,34px)'}}>{t.yourpath}</h1>
        <p className={"mt-1 "+scr} style={{color:'var(--muted)',maxWidth:560,margin:'8px auto 0'}}>{t.pathsub}</p>
      </div>
      <Card className="p-4 mb-5 flex items-center gap-4">
        <div style={{position:'relative',width:52,height:52,flex:'none'}}>
          <svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="none" stroke="var(--line)" strokeWidth="6"/><circle cx="26" cy="26" r="22" fill="none" stroke="var(--emerald)" strokeWidth="6" strokeLinecap="round" strokeDasharray={2*Math.PI*22} strokeDashoffset={2*Math.PI*22*(1-doneCount/total)} transform="rotate(-90 26 26)"/></svg>
          <div style={{position:'absolute',inset:0,display:'grid',placeItems:'center',fontWeight:800,fontSize:13}}>{pct}%</div>
        </div>
        <div className={scr}>
          <div style={{fontWeight:700}}>{doneCount} {t.of} {total} {t.letters} {t.learned}</div>
          <div style={{color:'var(--muted)',fontSize:13}}>{t.l1}</div>
        </div>
      </Card>
      <div className="grid gap-3">
        {rows.map(r=>(
          <Card key={r.k} className="p-4 flex items-center gap-4" style={r.soon?{opacity:.62}:{}}>
            <div className="disp" style={{width:42,height:42,flex:'none',borderRadius:12,display:'grid',placeItems:'center',fontSize:19,background:r.soon?'var(--line)':'linear-gradient(135deg,var(--gold2),var(--gold))',color:r.soon?'var(--muted)':'#3a2c05'}}>{r.n}</div>
            <div className="min-w-0 flex-1">
              <div className={"font-semibold "+scr} style={{color:'var(--ink)'}}>{r.title}{r.soon && <span className={"ml-2 text-[11px] "+scr} style={{color:'var(--gold)'}}>· {t.soon}</span>}</div>
              <div className={"text-[13px] "+scr} style={{color:'var(--muted)'}}>{r.d}</div>
            </div>
            {!r.soon && <button onClick={()=>setTab(r.tab)} className={"btn pri px-4 py-2 rounded-full text-[13.5px] shrink-0 "+scr}>{r.go}</button>}
          </Card>
        ))}
      </div>
    </div>
  );
}

function Alphabet({t,scr,L,nameOf,done,onSel}){
  return (
    <div className="fade">
      <h1 className={"disp "+scr} style={{fontSize:'clamp(22px,4vw,30px)'}}>{t.alphatitle}</h1>
      <p className={"mb-4 "+scr} style={{color:'var(--muted)'}}>{t.alphasub}</p>
      <div className="grid gap-2.5" style={{gridTemplateColumns:'repeat(auto-fill,minmax(88px,1fr))'}}>
        {L.map(l=>(
          <button key={l.c} onClick={()=>onSel(l)} className={"lcell p-2.5 text-center "+(done.has(l.c)?'done':'')}>
            <div className="ar" style={{fontSize:40,color:'var(--ink)',lineHeight:1.1}}>{l.c}</div>
            <div className={"text-[11.5px] font-semibold mt-1 truncate "+scr} style={{color:'var(--ink2)'}}>{nameOf(l)}</div>
            <div className="text-[10.5px]" style={{color:'var(--muted)'}}>{l.s}</div>
          </button>
        ))}
      </div>
      <p className={"mt-5 text-[12px] "+scr} style={{color:'var(--muted)'}}>{t.audionote}</p>
    </div>
  );
}

function LetterSheet({l,t,scr,nameOf,meanOf,done,toggleDone,onClose}){
  const f=forms(l.c);
  const isDone=done.has(l.c);
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onClose}>
      <div className="absolute inset-0" style={{background:'rgba(10,10,25,.5)',backdropFilter:'blur(3px)'}}></div>
      <div onClick={e=>e.stopPropagation()} className="sheet card relative w-full sm:max-w-lg p-6 sm:rounded-3xl" style={{borderBottomLeftRadius:0,borderBottomRightRadius:0,maxHeight:'92vh',overflowY:'auto',boxShadow:'var(--shadow)'}}>
        <button onClick={onClose} className="btn ghost absolute right-4 top-4 rounded-full w-8 h-8" style={{fontSize:16,lineHeight:1}}>×</button>
        <div className="text-center">
          <div className="ar" style={{fontSize:90,color:'var(--gold)',lineHeight:1}}>{l.c}</div>
          <div className={"disp mt-1 "+scr} style={{fontSize:24}}>{nameOf(l)}</div>
          <div className="text-[13px]" style={{color:'var(--muted)'}}>{t.sound}: <b style={{color:'var(--lapis)'}}>{l.s}</b></div>
          <button onClick={()=>speak(l.c)} className={"btn pri mt-3 px-5 py-2 rounded-full text-[14px] "+scr}>🔊 {t.listen}</button>
        </div>

        <div className="mt-6">
          <div className={"text-[11px] font-bold uppercase tracking-wider mb-2 "+scr} style={{color:'var(--gold)'}}>{t.forms}</div>
          <div className="grid grid-cols-4 gap-2">
            {[['iso',f.iso],['ini',f.ini],['med',f.med],['fin',f.fin]].map(([k,v])=>(
              <div key={k} className="text-center p-2 rounded-xl" style={{background:'color-mix(in srgb,var(--lapis) 7%,transparent)'}}>
                <div className="ar" style={{fontSize:30,color:'var(--ink)'}}>{v}</div>
                <div className={"text-[10.5px] mt-0.5 "+scr} style={{color:'var(--muted)'}}>{t[k]}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="mt-6">
          <div className={"text-[11px] font-bold uppercase tracking-wider mb-2 "+scr} style={{color:'var(--gold)'}}>{t.example}</div>
          <div className="flex items-center gap-3 p-3 rounded-2xl" style={{background:'color-mix(in srgb,var(--emerald) 8%,transparent)'}}>
            <div className="ar" style={{fontSize:34}}>{l.ex}</div>
            <div className="min-w-0">
              <div style={{fontWeight:700,fontSize:14}}>{l.tr}</div>
              <div className={"text-[13px] "+scr} style={{color:'var(--ink2)'}}>{meanOf(l)}</div>
            </div>
            <button onClick={()=>speak(l.ex)} className="btn ghost ml-auto rounded-full w-9 h-9 shrink-0" style={{fontSize:15}}>🔊</button>
          </div>
        </div>

        <button onClick={()=>toggleDone(l.c)} className={"btn w-full mt-6 py-3 rounded-2xl text-[14px] "+scr+(isDone?' ghost':' pri')} style={isDone?{color:'var(--emerald)',borderColor:'var(--emerald)'}:{}}>
          {isDone? t.doneL : t.marklearned}
        </button>
      </div>
    </div>
  );
}

function Vowels({t,scr,lang}){
  const dof = h => lang==='ta'?h.dt:lang==='hi'?h.dh:h.de;
  return (
    <div className="fade">
      <h1 className={"disp "+scr} style={{fontSize:'clamp(22px,4vw,30px)'}}>{t.voweltitle}</h1>
      <p className={"mb-4 "+scr} style={{color:'var(--muted)',maxWidth:640}}>{t.vowelsub}</p>
      <div className="grid gap-3" style={{gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))'}}>
        {HARAKAT.map(h=>(
          <Card key={h.name} className="p-4 flex gap-3 items-start">
            <div className="ar text-center" style={{fontSize:44,color:'var(--gold)',minWidth:56,lineHeight:1}}>{h.sym}</div>
            <div className="min-w-0">
              <div className="flex items-center gap-2">
                <div style={{fontWeight:700}}>{h.name}</div>
                <button onClick={()=>speak(h.sym)} className="btn ghost rounded-full w-7 h-7 text-[12px]">🔊</button>
              </div>
              <div className="text-[12.5px]" style={{color:'var(--lapis)'}}>{h.s}</div>
              <div className={"text-[12.5px] mt-1 "+scr} style={{color:'var(--ink2)'}}>{dof(h)}</div>
            </div>
          </Card>
        ))}
      </div>
      <p className={"mt-5 text-[12px] "+scr} style={{color:'var(--muted)'}}>{t.audionote}</p>
    </div>
  );
}

function Practice({t,scr,L,nameOf}){
  const N=8;
  const rnd=n=>Math.floor(Math.random()*n);
  const build=()=>{
    const pool=[...L];
    for(let i=pool.length-1;i>0;i--){ const j=rnd(i+1); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    return pool.slice(0,N).map(ans=>{
      const opts=[ans];
      while(opts.length<4){ const c=L[rnd(L.length)]; if(!opts.includes(c)) opts.push(c); }
      for(let i=opts.length-1;i>0;i--){ const j=rnd(i+1); [opts[i],opts[j]]=[opts[j],opts[i]]; }
      return {ans,opts};
    });
  };
  const [qs,setQs]=useState(build);
  const [i,setI]=useState(0);
  const [score,setScore]=useState(0);
  const [picked,setPicked]=useState(null);
  const [fin,setFin]=useState(false);
  const q=qs[i];

  const pick=o=>{ if(picked) return; setPicked(o); if(o===q.ans) setScore(s=>s+1); };
  const next=()=>{ if(i+1>=qs.length){ setFin(true); return; } setI(i+1); setPicked(null); };
  const restart=()=>{ setQs(build()); setI(0); setScore(0); setPicked(null); setFin(false); };

  if(fin) return (
    <div className="fade text-center py-10">
      <div style={{fontSize:52}}>{score>=qs.length-1?'🌟':score>=qs.length/2?'👍':'📚'}</div>
      <h1 className={"disp mt-2 "+scr} style={{fontSize:28}}>{t.done}</h1>
      <p className={"mt-1 "+scr} style={{color:'var(--muted)'}}>{t.youscored} <b style={{color:'var(--emerald)'}}>{score} / {qs.length}</b></p>
      <button onClick={restart} className={"btn pri mt-5 px-6 py-2.5 rounded-full "+scr}>{t.restart}</button>
    </div>
  );

  return (
    <div className="fade">
      <div className="flex items-center justify-between mb-3">
        <h1 className={"disp "+scr} style={{fontSize:'clamp(20px,4vw,26px)'}}>{t.practitle}</h1>
        <div className={"text-[13px] "+scr} style={{color:'var(--muted)'}}>{t.q} {i+1}/{qs.length} · {t.score} {score}</div>
      </div>
      <Card className="p-6 text-center">
        <p className={"text-[13px] mb-3 "+scr} style={{color:'var(--muted)'}}>{t.pracsub}</p>
        <div className="ar" style={{fontSize:82,color:'var(--gold)',lineHeight:1}}>{q.ans.c}</div>
        <button onClick={()=>speak(q.ans.c)} className="btn ghost rounded-full px-4 py-1.5 text-[13px] mt-2">🔊 {t.listen}</button>
        <div className="grid grid-cols-2 gap-2.5 mt-5">
          {q.opts.map((o,idx)=>{
            let cls='ghost';
            if(picked){ if(o===q.ans) cls='ok'; else if(o===picked) cls='no'; }
            const st = cls==='ok'?{background:'color-mix(in srgb,var(--emerald) 18%,transparent)',borderColor:'var(--emerald)',color:'var(--emerald)'}
                    : cls==='no'?{background:'color-mix(in srgb,#c0392b 15%,transparent)',borderColor:'#c0392b',color:'#c0392b'}:{};
            return <button key={idx} onClick={()=>pick(o)} className={"btn ghost py-3 rounded-2xl text-[15px] font-semibold "+scr} style={st}>{nameOf(o)}</button>;
          })}
        </div>
        {picked && <div className={"mt-4 "+scr}>
          <div style={{fontWeight:700,color:picked===q.ans?'var(--emerald)':'#c0392b'}}>{picked===q.ans?t.correct:t.tryagain}</div>
          <button onClick={next} className={"btn pri mt-3 px-6 py-2 rounded-full "+scr}>{t.next} →</button>
        </div>}
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
