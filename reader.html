        // ─── AI Explain & Discuss panel (Bayyinah) ────────────────────────
        function AiPanel({ verse, show, onClose, onGoToVerse }) {
            const s = Number(verse.Surah), a = Number(verse.Ayah);
            const [ansLang, setAnsLang] = useState(() => localStorage.getItem('bayyinahAnsLang') || (show.ta && !show.en ? 'ta' : 'en'));
            const [thread, setThread] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const bodyRef = useRef(null);

            useEffect(() => { localStorage.setItem('bayyinahAnsLang', ansLang); }, [ansLang]);

            const sysPrompt = lang => (
                'You are Bayyinah, a warm and careful Quran study assistant following the "God Alone, Quran Alone" perspective, based on ' +
                '"Quran: The Final Testament" translated by Rashad Khalifa, Ph.D.\n' +
                'The reader selected verse ' + s + ':' + a + '.\n' +
                (verse.Arabic ? 'Arabic: ' + verse.Arabic + '\n' : '') +
                (verse.English ? 'English: ' + String(verse.English).replace(/\*/g, '') + '\n' : '') +
                (verse.Tamil ? 'Tamil: ' + String(verse.Tamil).replace(/\*/g, '') + '\n' : '') +
                (verse.English_Footnote ? 'Footnote: ' + verse.English_Footnote + '\n' : '') +
                'Explain and discuss grounded ONLY in the Quran itself; cite related verses as (sura:verse). ' +
                'Do not use outside sources. Be clear and concise (under 300 words unless asked for more). ' +
                'Respond in ' + (lang === 'ta' ? 'Tamil' : 'English') + '.'
            );

            const send = async (msgs, lang) => {
                setLoading(true); setError(null);
                try {
                    const r = await fetch('api/ask', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ system: sysPrompt(lang), messages: msgs, maxTokens: 1400 })
                    });
                    const d = await r.json();
                    if (!r.ok || !d.text) throw new Error(d.error || 'The assistant is unavailable right now.');
                    setThread([...msgs, { role: 'assistant', content: d.text }]);
                } catch (e) { setError(String(e.message || e)); }
                setLoading(false);
            };

            useEffect(() => {
                const first = [{ role: 'user', content: ansLang === 'ta' ? ('\u0bb5\u0b9a\u0ba9\u0bae\u0bcd ' + s + ':' + a + ' \u0bb5\u0bbf\u0bb3\u0b95\u0bcd\u0b95\u0bb5\u0bc1\u0bae\u0bcd.') : ('Please explain verse ' + s + ':' + a + '.') }];
                setThread(first);
                send(first, ansLang);
            }, [s, a]);

            useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, [thread, loading]);

            const ask = () => {
                const q = input.trim();
                if (!q || loading) return;
                const msgs = [...thread, { role: 'user', content: q }];
                setThread(msgs); setInput('');
                send(msgs, ansLang);
            };

            return (
                <div className="fixed inset-0 z-[70]" onClick={onClose}>
                    <div className="absolute inset-0" style={{ background: 'rgba(9,14,32,.45)', backdropFilter: 'blur(2px)' }}></div>
                    <div onClick={e => e.stopPropagation()}
                         className="sheet-enter absolute bottom-0 left-0 right-0 sm:left-auto sm:top-0 sm:h-full sm:w-[440px] max-h-[88vh] sm:max-h-full rounded-t-3xl sm:rounded-none flex flex-col"
                         style={{ background: 'var(--bg-soft)', boxShadow: 'var(--shadow-lg)', borderLeft: '1px solid var(--line)' }}>

                        <div className="px-5 pt-5 pb-4 shrink-0" style={{ borderBottom: '1px solid var(--line)' }}>
                            <div className="flex items-center justify-between gap-2">
                                <div className="flex items-center gap-2 font-display text-lg" style={{ color: 'var(--ink)' }}>
                                    <span style={{ color: 'var(--gold)' }}><Icon d={I.spark} size={18} /></span>
                                    Explain &amp; Discuss
                                    <span className="vnum">{s}:{a}</span>
                                </div>
                                <button className="icon-btn" onClick={onClose}><Icon d={I.x} /></button>
                            </div>
                            <div className="flex items-center gap-1.5 mt-3">
                                {[['en', 'English'], ['ta', '\u0ba4\u0bae\u0bbf\u0bb4\u0bcd']].map(([k, label]) => (
                                    <button key={k} onClick={() => setAnsLang(k)}
                                            className={'lang-pill rounded-full font-bold text-xs px-3 py-1.5 ' + (ansLang === k ? 'on' : '') + (k === 'ta' ? ' font-tamil' : '')}>
                                        {label}
                                    </button>
                                ))}
                                <span className="text-[11px] ml-auto" style={{ color: 'var(--muted)' }}>grounded in the Quran</span>
                            </div>
                        </div>

                        <div ref={bodyRef} className="flex-1 overflow-y-auto px-5 py-4 space-y-3">
                            {thread.map((m, i) => (
                                m.role === 'user' ? (
                                    <div key={i} className="ml-8 rounded-2xl px-4 py-2.5 text-sm font-semibold"
                                         style={{ background: 'color-mix(in srgb, var(--accent) 12%, transparent)', color: 'var(--accent-deep)' }}>{m.content}</div>
                                ) : (
                                    <div key={i} className="ws-card rounded-2xl px-4 py-3 text-[14.5px] leading-relaxed whitespace-pre-wrap"
                                         style={{ color: 'var(--ink-soft)' }}>
                                        <TextWithRefs text={m.content} onRef={onGoToVerse} />
                                    </div>
                                )
                            ))}
                            {loading && (
                                <div className="ws-card rounded-2xl px-4 py-3 text-sm inline-flex items-center gap-2" style={{ color: 'var(--muted)' }}>
                                    <span className="spin inline-flex"><Icon d={I.loader} size={15} /></span> Bayyinah is reflecting\u2026
                                </div>
                            )}
                            {error && (
                                <div className="rounded-2xl px-4 py-3 text-sm" style={{ background: 'color-mix(in srgb, #dc2626 10%, transparent)', color: 'var(--ink-soft)' }}>
                                    {error}
                                    <button className="lang-pill rounded-full text-xs font-bold px-3 py-1 ml-2" onClick={() => send(thread, ansLang)}>Retry</button>
                                </div>
                            )}
                        </div>

                        <div className="px-4 py-3 shrink-0 flex items-center gap-2" style={{ borderTop: '1px solid var(--line)' }}>
                            <input value={input}
                                   onChange={e => setInput(e.target.value)}
                                   onKeyDown={e => e.key === 'Enter' && ask()}
                                   placeholder={ansLang === 'ta' ? '\u0b87\u0ba8\u0bcd\u0ba4 \u0bb5\u0b9a\u0ba9\u0bae\u0bcd \u0baa\u0bb1\u0bcd\u0bb1\u0bbf \u0b95\u0bc7\u0bb3\u0bc1\u0b99\u0bcd\u0b95\u0bb3\u0bcd\u2026' : 'Ask about this verse\u2026'}
                                   className={'search-input flex-1 px-4 py-2.5 rounded-full text-sm outline-none' + (ansLang === 'ta' ? ' font-tamil' : '')} />
                            <button onClick={ask} disabled={loading}
                                    className="icon-btn"
                                    style={{ background: 'var(--accent)', color: 'var(--bg-soft)', borderRadius: 999, width: 40, height: 40 }}>
                                <Icon d={I.send} size={16} />
                            </button>
                        </div>
                    </div>
                </div>
            );
        }


        // ─── Ask Bayyinah — the full assistant, integrated ────────────────
        function AskPanel({ verses, onClose, onGoToVerse }) {
            const [ansLang, setAnsLang] = useState(() => localStorage.getItem('bayyinahAnsLang') || 'en');
            const [thread, setThread] = useState(() => {
                try { return JSON.parse(localStorage.getItem('bayyinahAskThread')) || []; } catch (e) { return []; }
            });
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const bodyRef = useRef(null);

            useEffect(() => { localStorage.setItem('bayyinahAnsLang', ansLang); }, [ansLang]);
            useEffect(() => { localStorage.setItem('bayyinahAskThread', JSON.stringify(thread.slice(-40))); }, [thread]);
            useEffect(() => { if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight; }, [thread, loading]);

            const send = async (msgs, lang, question) => {
                setLoading(true); setError(null);
                try {
                    const picked = retrieveVerses(verses, question);
                    const ctx = picked.map(v => {
                        const txt = lang === 'ta' ? (v.Tamil || v.English || '') : (v.English || '');
                        const foot = lang === 'ta' ? (v.Tamil_Footnote || v.English_Footnote) : v.English_Footnote;
                        let line = '[' + v.Surah + ':' + v.Ayah + '] ' + String(txt).replace(/\*/g, '');
                        if (v.English_Subtitle && lang !== 'ta') line = '(Section: ' + v.English_Subtitle + ')\n' + line;
                        if (foot) line += '\nFOOTNOTE: ' + String(foot).replace(/\*/g, '');
                        return line;
                    }).join('\n\n');
                    const apx = retrieveAppendix(await loadAppendices(), question);
                    const apxCtx = apx.map(x => '[Appendix ' + x.n + ' — ' + x.title + '] ' + x.text).join('\n\n');
                    const r = await fetch('api/ask', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ system: BAYYINAH_SYS(lang, ctx, apxCtx), messages: msgs.slice(-12), maxTokens: 1600 })
                    });
                    const d = await r.json();
                    if (!r.ok || !d.text) throw new Error(d.error || 'The assistant is unavailable right now.');
                    setThread([...msgs, { role: 'assistant', content: d.text }]);
                } catch (e) { setError(String(e.message || e)); }
                setLoading(false);
            };

            const ask = (text) => {
                const q = (text !== undefined ? text : input).trim();
                if (!q || loading) return;
                const msgs = [...thread, { role: 'user', content: q }];
                setThread(msgs); setInput('');
                send(msgs, ansLang, q);
            };

            const newChat = () => { setThread([]); setError(null); };

            const starters = ansLang === 'ta'
                ? ['நம் வாழ்க்கையின் நோக்கம் என்ன?', '19 அதிசயத்தை விளக்குங்கள்', 'கவலையை எப்படி சமாளிப்பது?', 'தொழுகை பற்றி கூறுங்கள்']
                : ['What is the purpose of our life?', 'Explain the miracle of 19', 'How do I deal with anxiety?', 'What happens after death?'];

            return (
                <div className="fixed inset-0 z-[70]" onClick={onClose}>
                    <div className="absolute inset-0" style={{ background: 'rgba(9,14,32,.45)', backdropFilter: 'blur(2px)' }}></div>
                    <div onClick={e => e.stopPropagation()}
                         className="sheet-enter absolute bottom-0 left-0 right-0 sm:left-auto sm:top-0 sm:h-full sm:w-[500px] max-h-[92vh] sm:max-h-full rounded-t-3xl sm:rounded-none flex flex-col"
                         style={{ background: 'var(--bg-soft)', boxShadow: 'var(--shadow-lg)', borderLeft: '1px solid var(--line)' }}>

                        <div className="px-5 pt-4 pb-3 shrink-0" style={{ borderBottom: '1px solid var(--line)' }}>
                            <div className="flex items-center justify-between gap-2">
                                <div className="flex items-center gap-3">
                                    <BayyinahLogo size={40} />
                                    <div>
                                        <div className="font-display text-[19px] leading-tight" style={{ color: 'var(--ink)' }}>
                                            Bayyinah <span className="font-arabic" dir="rtl" style={{ color: 'var(--gold)', fontSize: 20 }}>الْبَيِّنَة</span>
                                        </div>
                                        <div className="text-[11.5px]" style={{ color: 'var(--muted)' }}>Quran study assistant · God Alone</div>
                                    </div>
                                </div>
                                <button className="icon-btn" onClick={onClose}><Icon d={I.x} /></button>
                            </div>
                            <div className="flex items-center gap-1.5 mt-3">
                                {[['en', 'English'], ['ta', 'தமிழ்']].map(([k, label]) => (
                                    <button key={k} onClick={() => setAnsLang(k)}
                                            className={'lang-pill rounded-full font-bold text-xs px-3 py-1.5 ' + (ansLang === k ? 'on' : '') + (k === 'ta' ? ' font-tamil' : '')}>
                                        {label}
                                    </button>
                                ))}
                                <button className="lang-pill rounded-full font-bold text-xs px-3 py-1.5 ml-auto" onClick={newChat}>New chat</button>
                            </div>
                        </div>

                        <div ref={bodyRef} className="flex-1 overflow-y-auto px-5 py-4 space-y-3">
                            {thread.length === 0 && !loading && (
                                <div className="text-center pt-6 pb-2">
                                    <div className="flex justify-center mb-4"><BayyinahLogo size={96} /></div>
                                    <div className="font-display text-lg mb-1" style={{ color: 'var(--ink)' }}>Peace be upon you</div>
                                    <p className="text-[13px] mb-5" style={{ color: 'var(--muted)' }}>
                                        Ask anything about the Quran — answers are grounded in the verses, with citations you can tap to read.
                                    </p>
                                    <div className="grid gap-2">
                                        {starters.map((q, i) => (
                                            <button key={i} className={'chip-q' + (ansLang === 'ta' ? ' font-tamil' : '')} onClick={() => ask(q)}>{q}</button>
                                        ))}
                                    </div>
                                </div>
                            )}
                            {thread.map((m, i) => (
                                m.role === 'user' ? (
                                    <div key={i} className={'ml-10 rounded-2xl px-4 py-2.5 text-sm font-semibold' + (ansLang === 'ta' ? ' font-tamil' : '')}
                                         style={{ background: 'color-mix(in srgb, var(--accent) 12%, transparent)', color: 'var(--accent-deep)' }}>{m.content}</div>
                                ) : (
                                    <div key={i} className="ws-card rounded-2xl px-4 py-3 text-[14.5px] leading-relaxed whitespace-pre-wrap"
                                         style={{ color: 'var(--ink-soft)' }}>
                                        <TextWithRefs text={m.content} onRef={onGoToVerse} />
                                    </div>
                                )
                            ))}
                            {loading && (
                                <div className="ws-card rounded-2xl px-4 py-3 text-sm inline-flex items-center gap-2" style={{ color: 'var(--muted)' }}>
                                    <span className="spin inline-flex"><Icon d={I.loader} size={15} /></span> Bayyinah is reflecting…
                                </div>
                            )}
                            {error && (
                                <div className="rounded-2xl px-4 py-3 text-sm" style={{ background: 'color-mix(in srgb, #dc2626 10%, transparent)', color: 'var(--ink-soft)' }}>
                                    {error}
                                    <button className="lang-pill rounded-full text-xs font-bold px-3 py-1 ml-2"
                                            onClick={() => { const last = thread[thread.length - 1]; if (last && last.role === 'user') send(thread, ansLang, last.content); }}>Retry</button>
                                </div>
                            )}
                        </div>

                        <div className="px-4 py-3 shrink-0 flex items-center gap-2" style={{ borderTop: '1px solid var(--line)' }}>
                            <input value={input}
                                   onChange={e => setInput(e.target.value)}
                                   onKeyDown={e => e.key === 'Enter' && ask()}
                                   placeholder={ansLang === 'ta' ? 'குர்ஆன் பற்றி எதையும் கேளுங்கள்…' : 'Ask anything about the Quran…'}
                                   className={'search-input flex-1 px-4 py-2.5 rounded-full text-sm outline-none' + (ansLang === 'ta' ? ' font-tamil' : '')} />
                            <button onClick={() => ask()} disabled={loading}
                                    className="icon-btn"
                                    style={{ background: 'var(--accent)', color: 'var(--bg-soft)', borderRadius: 999, width: 42, height: 42 }}>
                                <Icon d={I.send} size={16} />
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ─── Verse Card ───────────────────────────────────────────────────
        function VerseCard({ verse, wbwWords, show, fontSize, query, bookmarked,
                             onWord, playing, onPlay, onStopAudio, onBookmark, onCopy, onShare,
                             activeWordKey, isCurrentInContinuous, mode = 'verse', onExplain }) {
            const s = Number(verse.Surah), a = Number(verse.Ayah);
            const isBasmalah = a === 0;
            const arSizes = { small: 26, medium: 32, large: 40 };
            const trSizes = { small: 'text-sm', medium: 'text-[16px]', large: 'text-lg' };
            const hasFootnote = verse.English_Footnote || verse.Tamil_Footnote;
            const [openFootnote, setOpenFootnote] = useState(mode === 'word' && !!hasFootnote);
            useEffect(() => { setOpenFootnote(mode === 'word' && !!hasFootnote); }, [mode]);

            const arabicLine = wbwWords ? (
                <div dir="rtl" lang="ar" className={`font-arabic ${isBasmalah ? 'text-center' : 'text-right'}`}
                     style={{ fontSize: arSizes[fontSize] * (isBasmalah ? 0.9 : 1), lineHeight: 2.05, color: 'var(--ink)' }}>
                    {wbwWords.map((w, i) => (
                        <React.Fragment key={i}>
                            <span className={`arabic-word ${activeWordKey === `${s}:${a}:${i}` ? 'active' : ''}`}
                                  title={`${w[2]} (${w[1]})`}
                                  onClick={() => onWord({ surah: s, ayah: a, wordIndex: i, word: w })}>{w[0]}</span>
                            {' '}
                        </React.Fragment>
                    ))}
                </div>
            ) : verse.Arabic ? (
                <div dir="rtl" lang="ar" className={`font-arabic ${isBasmalah ? 'text-center' : 'text-right'}`}
                     style={{ fontSize: arSizes[fontSize], lineHeight: 2.05 }}>{verse.Arabic}</div>
            ) : null;

            return (
                <div id={`v-${s}-${a}`}
                     className={`ws-card rounded-2xl px-5 sm:px-7 py-5 ${isCurrentInContinuous ? 'playing-glow' : ''}`}>
                    {/* subtitles from Excel */}
                    {(show.en && verse.English_Subtitle) && (
                        <div className="text-center font-display font-semibold mb-3" style={{ color: 'var(--accent-deep)' }}>{verse.English_Subtitle}</div>
                    )}
                    {(show.ta && verse.Tamil_Subtitle) && (
                        <div className="text-center font-tamil text-sm mb-3" style={{ color: 'var(--accent)' }}>{verse.Tamil_Subtitle}</div>
                    )}

                    <div className="flex items-start justify-between gap-3 mb-1">
                        {!isBasmalah ? (
                            <span className="vnum shrink-0">{s}:{a}</span>
                        ) : <span className="eyebrow mt-1">Basmalah</span>}

                        <div className="flex items-center gap-0.5 -mr-2 -mt-1">
                            {!isBasmalah && (playing === `${s}:${a}`
                                ? <button className="icon-btn active" onClick={onStopAudio} title="Stop"><Icon d={I.stop} size={16} /></button>
                                : <button className="icon-btn" onClick={() => onPlay(s, a)} title="Recite (Qari)"><Icon d={I.volume} size={16} /></button>)}
                            {onExplain && !isBasmalah && (
                                <button className="icon-btn" onClick={() => onExplain(verse)} title="Explain & discuss (AI)"><Icon d={I.spark} size={16} /></button>
                            )}
                            <button className={`icon-btn ${bookmarked ? 'active' : ''}`} onClick={() => onBookmark(s, a)} title="Bookmark">
                                <Icon d={I.bookmark} size={16} />
                            </button>
                            <button className="icon-btn" onClick={() => onCopy(verse)} title="Copy"><Icon d={I.copy} size={16} /></button>
                            <button className="icon-btn" onClick={() => onShare(verse)} title="Share"><Icon d={I.share} size={16} /></button>
                        </div>
                    </div>

                    {mode !== 'word' && show.ar && arabicLine}

                    {show.en && verse.English && (
                        <p className={`verse-en ${trSizes[fontSize]} leading-relaxed mt-3 mb-0 ${isBasmalah ? 'text-center' : ''}`} style={{ color: 'var(--ink-soft)' }}>
                            <TransText text={verse.English} onStar={() => setOpenFootnote(o => !o)} query={query} />
                        </p>
                    )}
                    {show.ta && verse.Tamil && (
                        <p className={`font-tamil ${trSizes[fontSize]} leading-loose mt-3 mb-0 ${isBasmalah ? 'text-center' : ''}`} style={{ color: 'var(--ink-soft)' }}>
                            <TransText text={verse.Tamil} onStar={() => setOpenFootnote(o => !o)} query={query} />
                        </p>
                    )}

                    {/* word-by-word grid */}
                    {mode === 'word' && (
                        wbwWords ? (
                            <div dir="rtl" className={`flex flex-wrap gap-y-3 mt-5 ${isBasmalah ? 'justify-center' : ''}`}>
                                {wbwWords.map((w, i) => (
                                    <div key={i}
                                         className={`word-cell ${activeWordKey === `${s}:${a}:${i}` ? 'active' : ''}`}
                                         title={w[1]}
                                         onClick={() => onWord({ surah: s, ayah: a, wordIndex: i, word: w })}>
                                        <div className="font-arabic" lang="ar" style={{ fontSize: arSizes[fontSize], lineHeight: 1.7, color: 'var(--ink)' }}>{w[0]}</div>
                                        <div dir="ltr" className="text-[12px] font-bold mt-0.5 max-w-[110px] mx-auto leading-tight" style={{ color: 'var(--ink-soft)' }}>{w[2]}</div>
                                    </div>
                                ))}
                            </div>
                        ) : show.ar && arabicLine
                    )}

                    {hasFootnote && mode === 'word' && openFootnote && (
                        <div className="mt-4 text-[13.5px] italic leading-relaxed space-y-2" style={{ color: 'var(--muted)' }}>
                            {show.en !== false && verse.English_Footnote && <p className="m-0 whitespace-pre-line verse-en">{String(verse.English_Footnote).replace(/^\*/, '± ')}</p>}
                            {show.ta && verse.Tamil_Footnote && <p className="m-0 whitespace-pre-line font-tamil not-italic">{String(verse.Tamil_Footnote).replace(/^\*/, '± ')}</p>}
                        </div>
                    )}
                    {hasFootnote && mode !== 'word' && (
                        <div className="mt-3">
                            {!openFootnote ? (
                                <button onClick={() => setOpenFootnote(true)}
                                        className="text-xs font-semibold inline-flex items-center gap-1"
                                        style={{ color: 'var(--emerald)', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>
                                    <span className="footnote-star">*</span> Footnote{show.ta ? <span className="font-tamil"> · அடிக்குறிப்பு</span> : null}
                                </button>
                            ) : (
                                <div className="fade-in rounded-xl px-4 py-3 text-sm leading-relaxed"
                                     style={{ background: 'color-mix(in srgb, var(--emerald) 7%, transparent)', border: '1px solid color-mix(in srgb, var(--emerald) 25%, transparent)' }}>
                                    <div className="flex justify-between items-start gap-2">
                                        <div className="space-y-2" style={{ color: 'var(--ink-soft)' }}>
                                            {show.en && verse.English_Footnote && <p className="m-0 whitespace-pre-line">{verse.English_Footnote}</p>}
                                            {show.ta && verse.Tamil_Footnote && <p className="m-0 font-tamil whitespace-pre-line">{verse.Tamil_Footnote}</p>}
                                            {!show.en && !show.ta && verse.English_Footnote && <p className="m-0 whitespace-pre-line">{verse.English_Footnote}</p>}
                                        </div>
                                        <button className="icon-btn" style={{ width: 26, height: 26 }} onClick={() => setOpenFootnote(false)}><Icon d={I.x} size={14} /></button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // ─── Reading (book-flow) view ─────────────────────────────────────
        function ReadingView({ list, wbw, show, fontSize, onWord }) {
            const arSizes = { small: 25, medium: 31, large: 39 };
            const trSizes = { small: 'text-[15px]', medium: 'text-[17px]', large: 'text-[19px]' };
            return (
                <div className="ws-card rounded-2xl px-6 sm:px-10 py-8 space-y-8">
                    {show.ar && (
                        <div dir="rtl" lang="ar" className="font-arabic" style={{ fontSize: arSizes[fontSize], lineHeight: 2.25, color: 'var(--ink)', textAlign: 'justify' }}>
                            {list.map(v => {
                                const s = Number(v.Surah), a = Number(v.Ayah);
                                const words = wbw ? wbw[String(a)] : null;
                                return (
                                    <React.Fragment key={a}>
                                        {words
                                            ? words.map((w, i) => (
                                                <React.Fragment key={i}>
                                                    <span className="arabic-word" title={`${w[2]} (${w[1]})`}
                                                          onClick={() => onWord({ surah: s, ayah: a, wordIndex: i, word: w })}>{w[0]}</span>{' '}
                                                </React.Fragment>
                                            ))
                                            : (v.Arabic ? v.Arabic + ' ' : '')}
                                        {a > 0 && <span className="vnum-inline">{a}</span>}{' '}
                                    </React.Fragment>
                                );
                            })}
                        </div>
                    )}
                    {show.en && (
                        <p className={`verse-en ${trSizes[fontSize]} leading-loose m-0`} style={{ color: 'var(--ink-soft)' }}>
                            {list.map(v => (
                                <React.Fragment key={v.Ayah}>
                                    {Number(v.Ayah) > 0 && <sup className="font-bold mr-0.5" style={{ color: 'var(--accent)' }}>{v.Ayah}</sup>}
                                    {String(v.English || '').replace(/\*/g, '')}{' '}
                                </React.Fragment>
                            ))}
                        </p>
                    )}
                    {show.ta && (
                        <p className={`font-tamil ${trSizes[fontSize]} leading-loose m-0`} style={{ color: 'var(--ink-soft)' }}>
                            {list.map(v => (
                                <React.Fragment key={v.Ayah}>
                                    {Number(v.Ayah) > 0 && <sup className="font-bold mr-0.5" style={{ color: 'var(--accent)' }}>{v.Ayah}</sup>}
                                    {String(v.Tamil || '').replace(/\*/g, '')}{' '}
                                </React.Fragment>
                            ))}
                        </p>
                    )}
                    {!show.ar && !show.en && !show.ta && (
                        <p className="text-center text-sm m-0" style={{ color: 'var(--muted)' }}>All languages are turned off — enable one in Settings or the language pills.</p>
                    )}

                    {/* endnotes — footnotes preserved in book-flow mode */}
                    {(show.en || show.ta) && list.some(v => v.English_Footnote || v.Tamil_Footnote) && (
                        <div style={{ borderTop: '1px solid var(--line)' }} className="pt-6">
                            <div className="eyebrow mb-3">Footnotes{show.ta ? <span className="font-tamil normal-case tracking-normal"> · அடிக்குறிப்புகள்</span> : null}</div>
                            <div className="space-y-3">
                                {list.filter(v => v.English_Footnote || v.Tamil_Footnote).map(v => (
                                    <div key={v.Ayah} className="text-[13.5px] italic leading-relaxed space-y-1.5" style={{ color: 'var(--muted)' }}>
                                        {show.en && v.English_Footnote && <p className="m-0 whitespace-pre-line verse-en">{String(v.English_Footnote).replace(/^\*/, '± ')}</p>}
                                        {show.ta && v.Tamil_Footnote && <p className="m-0 whitespace-pre-line font-tamil not-italic">{String(v.Tamil_Footnote).replace(/^\*/, '± ')}</p>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ─── Main App ─────────────────────────────────────────────────────
        function App() {
            const [verses, setVerses] = useState([]);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('home');          // 'home' | 'reader' | 'search'
            const [currentSurah, setCurrentSurah] = useState(1);
            const [dark, setDark] = useState(() => localStorage.getItem('quranTheme') === 'dark');
            const [show, setShow] = useState(() => {
                try { return JSON.parse(localStorage.getItem('quranLangs')) || { ar: true, en: true, ta: true }; }
                catch (e) { return { ar: true, en: true, ta: true }; }
            });
            const [fontSize, setFontSize] = useState(() => localStorage.getItem('quranFontSize') || 'medium');
            const [query, setQuery] = useState('');
            const [searchResults, setSearchResults] = useState(null);
            const [activeQuery, setActiveQuery] = useState('');
            const [wbw, setWbw] = useState(null);              // wbw for current surah
            const [wordSel, setWordSel] = useState(null);
            const [bookmarks, setBookmarks] = useState(() => {
                try { return JSON.parse(localStorage.getItem('quranBookmarks')) || []; } catch (e) { return []; }
            });
            const [showBookmarks, setShowBookmarks] = useState(false);
            const [playing, setPlaying] = useState(null);
            const [continuous, setContinuous] = useState(false);
            const [toast, setToast] = useState(null);
            const [randomV, setRandomV] = useState(null);
            const [chaptersOpen, setChaptersOpen] = useState(true);
            const [mode, setModeState] = useState(() => localStorage.getItem('quranMode') || 'verse');
            const setMode = m => { setModeState(m); localStorage.setItem('quranMode', m); };
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);
            const [chapterFilter, setChapterFilter] = useState('');
            const [order, setOrder] = useState('standard');
            const [showSettings, setShowSettings] = useState(false);
            const [lastPos, setLastPos] = useState(() => {
                try { return JSON.parse(localStorage.getItem('quranLastPos')); } catch (e) { return null; }
            });
            const [showRange, setShowRange] = useState(false);
            const [rangeCfg, setRangeCfg] = useState({ fromS: 1, fromA: 1, toS: 1, toA: 7 });
            const [aiSel, setAiSel] = useState(null);
            const [askOpen, setAskOpen] = useState(false);
            const audioRef = useRef(null);
            const continuousRef = useRef(false);

            const [palette, setPalette] = useState(() => localStorage.getItem('quranPalette3') || 'lapis');

            // theme + palette
            useEffect(() => {
                const el = document.documentElement;
                el.classList.toggle('dark', dark);
                el.classList.remove('p-amethyst', 'p-emerald', 'p-velvet', 'p-parchment');
                if (palette !== 'lapis') el.classList.add('p-' + palette);
                localStorage.setItem('quranTheme', dark ? 'dark' : 'light');
                localStorage.setItem('quranPalette3', palette);
            }, [dark, palette]);
            useEffect(() => { localStorage.setItem('quranLangs', JSON.stringify(show)); }, [show]);
            useEffect(() => { localStorage.setItem('quranFontSize', fontSize); }, [fontSize]);
            useEffect(() => { localStorage.setItem('quranBookmarks', JSON.stringify(bookmarks)); }, [bookmarks]);

            // load excel
            useEffect(() => {
                (async () => {
                    try {
                        const res = await fetch('quran-data.json');
                        const data = await res.json();
                        setVerses(data);
                        setLoading(false);
                    } catch (e) {
                        console.error(e); setLoading(false);
                    }
                })();
            }, []);

            // load wbw for current surah
            useEffect(() => {
                let dead = false;
                setWbw(null);
                loadWbw(currentSurah).then(j => { if (!dead) setWbw(j); }).catch(() => {});
                return () => { dead = true; };
            }, [currentSurah]);

            const surahVerses = useMemo(
                () => verses.filter(v => Number(v.Surah) === currentSurah),
                [verses, currentSurah]);

            const flash = msg => { setToast(msg); setTimeout(() => setToast(null), 2200); };

            // ── audio & reading (recitation in ar/en/ta) ──
            const playTokenRef = useRef(0);
            const [playLangs, setPlayLangs] = useState(() => {
                try { return JSON.parse(localStorage.getItem('quranPlayLangs')) || { ar: true, en: false, ta: false }; }
                catch (e) { return { ar: true, en: false, ta: false }; }
            });
            useEffect(() => { localStorage.setItem('quranPlayLangs', JSON.stringify(playLangs)); }, [playLangs]);

            // warm up the speech-synthesis voice list (async on some browsers)
            useEffect(() => {
                if (!window.speechSynthesis) return;
                window.speechSynthesis.getVoices();
                const onv = () => window.speechSynthesis.getVoices();
                window.speechSynthesis.addEventListener('voiceschanged', onv);
                return () => window.speechSynthesis.removeEventListener('voiceschanged', onv);
            }, []);

            const ttsAudioRef = useRef(null);

            const stopAudio = useCallback(() => {
                playTokenRef.current++;
                continuousRef.current = false;
                setContinuous(false);
                if (audioRef.current) { audioRef.current.pause(); audioRef.current.src = ''; }
                if (ttsAudioRef.current) { ttsAudioRef.current.pause(); ttsAudioRef.current.src = ''; }
                try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
                setPlaying(null);
            }, []);

            // split text into <=150-char chunks at word boundaries (Google TTS limit)
            const splitTTSChunks = (text, maxLen = 150) => {
                const chunks = [];
                let remaining = String(text).replace(/\*/g, '').trim();
                while (remaining.length > 0) {
                    if (remaining.length <= maxLen) { chunks.push(remaining); break; }
                    let splitAt = -1;
                    for (let i = maxLen; i >= maxLen * 0.5; i--) {
                        if ('.,;:!?'.includes(remaining[i])) { splitAt = i + 1; break; }
                    }
                    if (splitAt === -1) {
                        for (let i = maxLen; i >= maxLen * 0.5; i--) {
                            if (remaining[i] === ' ') { splitAt = i + 1; break; }
                        }
                    }
                    if (splitAt === -1) splitAt = maxLen;
                    chunks.push(remaining.substring(0, splitAt).trim());
                    remaining = remaining.substring(splitAt).trim();
                }
                return chunks.filter(Boolean);
            };

            // Tamil (and fallback) TTS through the server-side Google proxy — same voice as the live site
            const playProxyTTS = (text, lang, token) => new Promise((resolve, reject) => {
                const chunks = splitTTSChunks(text);
                if (!chunks.length) return resolve();
                let i = 0;
                const next = () => {
                    if (playTokenRef.current !== token || i >= chunks.length) return resolve();
                    const audio = new Audio(`api/tts?tl=${lang}&q=${encodeURIComponent(chunks[i])}`);
                    ttsAudioRef.current = audio;
                    audio.onended = () => { i++; next(); };
                    audio.onerror = () => reject(new Error('tts-proxy failed'));
                    audio.onpause = () => { if (playTokenRef.current !== token) resolve(); };
                    audio.play().catch(reject);
                };
                next();
            });

            const playQari = (s, a, token) => new Promise(resolve => {
                if (a === 0) return resolve();
                const audio = new Audio(qariUrl(s, a));
                audioRef.current = audio;
                audio.onended = resolve;
                audio.onerror = resolve;
                audio.onpause = () => { if (playTokenRef.current !== token) resolve(); };
                audio.play().catch(resolve);
            });

            const speak = (text, lang) => new Promise(resolve => {
                if (!text || !window.speechSynthesis) return resolve();
                const u = new SpeechSynthesisUtterance(String(text).replace(/\*/g, ''));
                u.lang = lang === 'ta' ? 'ta-IN' : 'en-US';
                const voices = window.speechSynthesis.getVoices();
                const v = voices.find(x => x.lang && x.lang.toLowerCase().startsWith(lang === 'ta' ? 'ta' : 'en'));
                if (v) u.voice = v;
                else if (lang === 'ta') return resolve();   // no Tamil voice installed — skip gracefully
                u.onend = resolve;
                u.onerror = resolve;
                window.speechSynthesis.speak(u);
            });

            const playVerseSeq = useCallback(async (s, a, token) => {
                const v = verses.find(x => Number(x.Surah) === s && Number(x.Ayah) === a);
                setPlaying(`${s}:${a}`);
                const langs = (playLangs.ar || playLangs.en || playLangs.ta) ? playLangs : { ar: true };
                if (langs.ar) { await playQari(s, a, token); if (playTokenRef.current !== token) return; }
                if (langs.en && v && v.English) { await speak(v.English, 'en'); if (playTokenRef.current !== token) return; }
                if (langs.ta && v && v.Tamil) {
                    try { await playProxyTTS(v.Tamil, 'ta', token); }
                    catch (e) { await speak(v.Tamil, 'ta'); }
                    if (playTokenRef.current !== token) return;
                }
            }, [playLangs, verses]);

            const playSingle = useCallback(async (s, a) => {
                stopAudio();
                const token = ++playTokenRef.current;
                await playVerseSeq(s, a, token);
                if (playTokenRef.current === token) setPlaying(null);
            }, [playVerseSeq, stopAudio]);

            const playSurah = useCallback(async () => {
                stopAudio();
                const token = ++playTokenRef.current;
                continuousRef.current = true;
                setContinuous(true);
                const count = VERSE_COUNTS[currentSurah - 1];
                for (let a = 1; a <= count; a++) {
                    if (playTokenRef.current !== token) return;
                    const el = document.getElementById(`v-${currentSurah}-${a}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    await playVerseSeq(currentSurah, a, token);
                }
                if (playTokenRef.current === token) stopAudio();
            }, [currentSurah, playVerseSeq, stopAudio]);

            // continuous play over an arbitrary range, across chapter boundaries
            const playRange = useCallback(async (cfg) => {
                let fromS = Math.min(114, Math.max(1, Number(cfg.fromS) || 1));
                let toS = Math.min(114, Math.max(1, Number(cfg.toS) || 1));
                let fromA = Math.min(VERSE_COUNTS[fromS - 1], Math.max(1, Number(cfg.fromA) || 1));
                let toA = Math.min(VERSE_COUNTS[toS - 1], Math.max(1, Number(cfg.toA) || 1));
                if (toS < fromS || (toS === fromS && toA < fromA)) { flash('Invalid range — "To" comes before "From"'); return; }
                setShowRange(false);
                stopAudio();
                const token = ++playTokenRef.current;
                continuousRef.current = true;
                setContinuous(true);
                setSearchResults(null);
                setView('reader');
                for (let s = fromS; s <= toS; s++) {
                    if (playTokenRef.current !== token) return;
                    setCurrentSurah(s);
                    await new Promise(res => setTimeout(res, wbwCache[s] ? 350 : 1000));
                    const aStart = s === fromS ? fromA : 1;
                    const aEnd = s === toS ? toA : VERSE_COUNTS[s - 1];
                    for (let a = aStart; a <= aEnd; a++) {
                        if (playTokenRef.current !== token) return;
                        const el = document.getElementById(`v-${s}-${a}`);
                        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        await playVerseSeq(s, a, token);
                    }
                }
                if (playTokenRef.current === token) stopAudio();
            }, [playVerseSeq, stopAudio]);

            // ── navigation ──
            const goToVerse = useCallback((s, a) => {
                setWordSel(null);
                setSearchResults(null);
                setView('reader');
                setCurrentSurah(s);
                setTimeout(() => {
                    const el = document.getElementById(`v-${s}-${a}`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        el.style.outline = '2px solid var(--gold)';
                        el.style.outlineOffset = '3px';
                        setTimeout(() => { el.style.outline = 'none'; }, 2400);
                    }
                }, wbwCache[s] ? 250 : 800);
            }, []);

            const openSurah = s => {
                stopAudio();
                setSearchResults(null); setQuery('');
                setCurrentSurah(s); setView('reader');
                window.scrollTo({ top: 0 });
            };

            // ── search ──
            const runSearch = () => {
                const q = query.trim();
                if (!q) return;
                const m = q.match(/^(\d{1,3})\s*[:.]\s*(\d{1,3})$/);
                if (m) { goToVerse(Number(m[1]), Number(m[2])); return; }
                if (/^\d{1,3}$/.test(q) && Number(q) >= 1 && Number(q) <= 114) { openSurah(Number(q)); return; }
                const lq = q.toLowerCase();
                const res = verses.filter(v =>
                    (v.English && String(v.English).toLowerCase().includes(lq)) ||
                    (v.Tamil && String(v.Tamil).includes(q)) ||
                    (v.Arabic && String(v.Arabic).includes(q)) ||
                    (v.English_Footnote && String(v.English_Footnote).toLowerCase().includes(lq))
                );
                setActiveQuery(q);
                setSearchResults(res.slice(0, 300));
                setView('search');
                window.scrollTo({ top: 0 });
            };

            // ── verse actions ──
            const toggleBookmark = (s, a) => {
                const key = `${s}:${a}`;
                setBookmarks(b => b.includes(key) ? b.filter(x => x !== key) : [...b, key]);
            };
            const copyVerse = v => {
                const bits = [`[${v.Surah}:${v.Ayah}]`];
                if (show.ar && v.Arabic) bits.push(v.Arabic);
                if (show.en && v.English) bits.push(String(v.English).replace(/\*/g, ''));
                if (show.ta && v.Tamil) bits.push(String(v.Tamil).replace(/\*/g, ''));
                bits.push('— Bayyinah · ' + location.origin);
                navigator.clipboard.writeText(bits.join('\n')).then(() => flash('Verse copied'));
            };
            const shareVerse = v => {
                const text = `[${v.Surah}:${v.Ayah}] ${String(v.English || '').replace(/\*/g, '')}\n${location.origin}/reader.html`;
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
            };
            const showRandom = () => {
                const pool = verses.filter(v => Number(v.Ayah) > 0);
                setRandomV(pool[Math.floor(Math.random() * pool.length)]);
            };

            const meta = surahs[currentSurah - 1];

            // Escape closes overlays
            useEffect(() => {
                const onKey = e => {
                    if (e.key !== 'Escape') return;
                    if (aiSel) setAiSel(null);
                    else if (wordSel) setWordSel(null);
                    else if (askOpen) setAskOpen(false);
                    else if (showRange) setShowRange(false);
                    else if (showBookmarks) setShowBookmarks(false);
                    else if (randomV) setRandomV(null);
                    else if (showSettings) setShowSettings(false);
                    else if (sidebarOpen && window.innerWidth < 1024) setSidebarOpen(false);
                };
                document.addEventListener('keydown', onKey);
                return () => document.removeEventListener('keydown', onKey);
            }, [wordSel, showBookmarks, randomV, showSettings, sidebarOpen, showRange, aiSel, askOpen]);

            // remember reading position (welcome back)
            useEffect(() => {
                if (view !== 'reader') return;
                let t = null;
                const onScroll = () => {
                    if (t) return;
                    t = setTimeout(() => {
                        t = null;
                        const cards = document.querySelectorAll(`[id^="v-${currentSurah}-"]`);
                        for (const el of cards) {
                            if (el.getBoundingClientRect().bottom > 120) {
                                const a = Number(el.id.split('-')[2]);
                                if (isNaN(a) || a === 0) continue;   // skip basmalah rows
                                const pos = { s: currentSurah, a };
                                localStorage.setItem('quranLastPos', JSON.stringify(pos));
                                setLastPos(pos);
                                break;
                            }
                        }
                    }, 1200);
                };
                window.addEventListener('scroll', onScroll, { passive: true });
                onScroll();
                return () => { window.removeEventListener('scroll', onScroll); if (t) clearTimeout(t); };
            }, [view, currentSurah]);

            // sidebar chapter list (filter + order)
            const chapterList = useMemo(() => {
                let list = surahs.map((su, i) => ({ ...su, n: i + 1 }));
                if (order === 'revelation') list = [...list].sort((a, b) => a.revelationOrder - b.revelationOrder);
                const f = chapterFilter.trim().toLowerCase();
                if (f) list = list.filter(su =>
                    String(su.n) === f ||
                    su.en.toLowerCase().includes(f) ||
                    su.ta.includes(chapterFilter.trim()) ||
                    su.ar.includes(chapterFilter.trim()));
                return list;
            }, [chapterFilter, order]);

            const contentPad = sidebarOpen ? 'lg:pl-[292px]' : '';

            const Seg = ({ className }) => (
                <div className={`seg ${className || ''}`}>
                    {[['verse', 'Verse', I.list], ['word', 'Word', I.type], ['reading', 'Reading', I.bookOpen]].map(([k, label, ic]) => (
                        <button key={k} className={mode === k ? 'on' : ''} onClick={() => setMode(k)}>
                            <Icon d={ic} size={14} /> {label}
                        </button>
                    ))}
                </div>
            );

            // ── language pills ──
            const LangPills = ({ compact }) => (
                <div className="flex items-center gap-1.5">
                    {[['ar', 'ع'], ['en', 'En'], ['ta', 'த']].map(([k, label]) => (
                        <button key={k}
                                onClick={() => setShow(s => ({ ...s, [k]: !s[k] }))}
                                className={`lang-pill rounded-full font-bold ${compact ? 'text-xs px-3 py-1.5' : 'text-sm px-4 py-2'} ${show[k] ? 'on' : ''}`}
                                title={{ ar: 'Arabic', en: 'English', ta: 'Tamil' }[k]}>
                            {label}
                        </button>
                    ))}
                </div>
            );

            if (loading) return (
                <div className="min-h-screen paper-dots flex flex-col items-center justify-center gap-5">
                    <div className="font-arabic text-4xl" dir="rtl" style={{ color: 'var(--gold)' }}>بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
                    <div className="flex items-center gap-2 text-sm" style={{ color: 'var(--muted)' }}>
                        <span className="spin inline-flex"><Icon d={I.loader} /></span> Loading the Quran…
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen paper-dots pb-24">
                    {/* ── Table of contents sidebar ── */}
                    {sidebarOpen && (
                        <div className="fixed inset-0 z-[55] lg:hidden" style={{ background: 'rgba(9,14,32,.45)', backdropFilter: 'blur(2px)' }}
                             onClick={() => setSidebarOpen(false)}></div>
                    )}
                    <aside className={`sidebar ${sidebarOpen ? 'open' : ''}`}>
                        <div className="flex items-center justify-between pl-4 pr-2 h-14 shrink-0" style={{ borderBottom: '1px solid var(--line)' }}>
                            <button className="flex items-center gap-2.5 bg-transparent border-none cursor-pointer p-0 font-display text-[16px]"
                                    style={{ color: 'var(--ink)' }}
                                    onClick={() => { stopAudio(); setView('home'); setSearchResults(null); if (window.innerWidth < 1024) setSidebarOpen(false); window.scrollTo({ top: 0 }); }}>
                                <BayyinahLogo size={30} />
                                <span className="text-left leading-tight">
                                    <span className="block text-[14.5px]">Quran · The Final Testament</span>
                                    <span className="block text-[10.5px] font-sans font-semibold" style={{ color: 'var(--muted)' }}>Bayyinah — Quran study assistant</span>
                                </span>
                            </button>
                            <button className="icon-btn" onClick={() => setSidebarOpen(false)}><Icon d={I.x} /></button>
                        </div>

                        <div className="px-3 py-3 shrink-0 space-y-0.5" style={{ borderBottom: '1px solid var(--line)' }}>
                            <button className="side-link" onClick={() => { setAskOpen(true); if (window.innerWidth < 1024) setSidebarOpen(false); }}>
                                <Icon d={I.spark} size={16} /> Ask Bayyinah <span className="ml-auto" style={{ color: 'var(--muted)' }}><Icon d={I.right} size={14} /></span>
                            </button>
                            <button className="side-link" onClick={() => { stopAudio(); setView('home'); setSearchResults(null); if (window.innerWidth < 1024) setSidebarOpen(false); window.scrollTo({ top: 0 }); }}>
                                <Icon d={I.home} size={16} /> Browse <span className="ml-auto" style={{ color: 'var(--muted)' }}><Icon d={I.right} size={14} /></span>
                            </button>
                            <button className="side-link" onClick={() => setShowBookmarks(true)}>
                                <Icon d={I.bookmark} size={16} /> Bookmarks <span className="ml-auto" style={{ color: 'var(--muted)' }}><Icon d={I.right} size={14} /></span>
                            </button>
                            <a className="side-link" href="https://www.wikisubmission.org/proclamation" target="_blank" rel="noopener">
                                <Icon d={I.book} size={16} /> Proclamation <span className="ml-auto" style={{ color: 'var(--muted)' }}><Icon d={I.external} size={13} /></span>
                            </a>

                                    <div>
                                        <div className="eyebrow mb-1.5">From Surah</div>
                                        <select value={rangeCfg.fromS}
                                                onChange={e => { const s = Number(e.target.value); setRangeCfg(c => ({ ...c, fromS: s, fromA: 1 })); }}
                                                className="search-input w-full px-3 py-2.5 rounded-xl text-sm outline-none">
                                            {surahs.map((su, i) => <option key={i} value={i + 1}>{i + 1}. {su.en.replace(/\s*\(.*\)$/, '')}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <div className="eyebrow mb-1.5">From Ayah</div>
                                        <input type="number" min="1" max={VERSE_COUNTS[rangeCfg.fromS - 1]} value={rangeCfg.fromA}
                                               onChange={e => setRangeCfg(c => ({ ...c, fromA: e.target.value }))}
                                               className="search-input w-full px-3 py-2.5 rounded-xl text-sm outline-none" />
                                    </div>
                                    <div>
                                        <div className="eyebrow mb-1.5">To Surah</div>
                                        <select value={rangeCfg.toS}
                                                onChange={e => { const s = Number(e.target.value); setRangeCfg(c => ({ ...c, toS: s, toA: VERSE_COUNTS[s - 1] })); }}
                                                className="search-input w-full px-3 py-2.5 rounded-xl text-sm outline-none">
                                            {surahs.map((su, i) => <option key={i} value={i + 1}>{i + 1}. {su.en.replace(/\s*\(.*\)$/, '')}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <div className="eyebrow mb-1.5">To Ayah</div>
                                        <input type="number" min="1" max={VERSE_COUNTS[rangeCfg.toS - 1]} value={rangeCfg.toA}
                                               onChange={e => setRangeCfg(c => ({ ...c, toA: e.target.value }))}
                                               className="search-input w-full px-3 py-2.5 rounded-xl text-sm outline-none" />
                                    </div>
                                </div>

                                <p className="text-[12px] mt-0 mb-4" style={{ color: 'var(--muted)' }}>
                                    Reads every verse in the range using your enabled voices (Qari / English / Tamil), continuing across chapters.
                                </p>

                                <div className="flex gap-2">
                                    <button onClick={() => playRange(rangeCfg)}
                                            className="flex-1 inline-flex items-center justify-center gap-2 py-2.5 rounded-full text-sm font-bold cursor-pointer"
                                            style={{ background: 'var(--accent)', color: 'var(--bg-soft)', border: 'none' }}>
                                        <Icon d={I.play} size={14} /> Start Continuous Play
                                    </button>
                                    <button className="lang-pill px-5 py-2.5 rounded-full text-sm font-bold" onClick={() => setShowRange(false)}>Cancel</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── Bookmarks modal ── */}
                    {showBookmarks && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4" onClick={() => setShowBookmarks(false)}>
                            <div className="absolute inset-0" style={{ background: 'rgba(20,14,8,.45)', backdropFilter: 'blur(2px)' }}></div>
                            <div onClick={e => e.stopPropagation()}
                                 className="fade-in relative w-full max-w-md max-h-[70vh] overflow-y-auto rounded-3xl p-6"
                                 style={{ background: 'var(--bg-soft)', boxShadow: 'var(--shadow-lg)', border: '1px solid var(--line)' }}>
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-display font-bold text-xl m-0">Bookmarks</h3>
                                    <button className="icon-btn" onClick={() => setShowBookmarks(false)}><Icon d={I.x} /></button>
                                </div>
                                {bookmarks.length === 0
                                    ? <p className="text-sm" style={{ color: 'var(--muted)' }}>No bookmarks yet — tap the bookmark icon on any verse.</p>
                                    : <div className="space-y-2">
                                        {bookmarks.map(k => {
                                            const [s, a] = k.split(':').map(Number);
                                            const v = verses.find(x => Number(x.Surah) === s && Number(x.Ayah) === a);
                                            return (
                                                <div key={k} className="ws-card ws-card-hover rounded-xl px-4 py-3 flex items-center gap-3 cursor-pointer"
                                                     onClick={() => { setShowBookmarks(false); goToVerse(s, a); }}>
                                                    <span className="font-display font-bold text-sm px-2 py-0.5 rounded-md shrink-0"
                                                          style={{ background: 'color-mix(in srgb, var(--accent) 12%, transparent)', color: 'var(--accent-deep)' }}>{k}</span>
                                                    <span className="text-sm truncate" style={{ color: 'var(--ink-soft)' }}>
                                                        {v ? String(v.English || v.Tamil || '').replace(/\*/g, '').slice(0, 70) : ''}
                                                    </span>
                                                    <button className="icon-btn ml-auto shrink-0" style={{ width: 28, height: 28 }}
                                                            onClick={e => { e.stopPropagation(); toggleBookmark(s, a); }}>
                                                        <Icon d={I.x} size={14} />
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>}
                            </div>
                        </div>
                    )}

                    {/* ── Random verse modal ── */}
                    {randomV && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4" onClick={() => setRandomV(null)}>
                            <div className="absolute inset-0" style={{ background: 'rgba(20,14,8,.45)', backdropFilter: 'blur(2px)' }}></div>
                            <div onClick={e => e.stopPropagation()}
                                 className="fade-in relative w-full max-w-lg max-h-[80vh] overflow-y-auto rounded-3xl p-7"
                                 style={{ background: 'var(--bg-soft)', boxShadow: 'var(--shadow-lg)', border: '1px solid var(--line)' }}>
                                <div className="eyebrow mb-3">Random verse · {randomV.Surah}:{randomV.Ayah}</div>
                                {show.ar && randomV.Arabic && <div className="font-arabic text-right leading-loose mb-3" dir="rtl" style={{ fontSize: 28 }}>{randomV.Arabic}</div>}
                                {show.en && randomV.English && <p className="verse-en text-[16px] leading-relaxed" style={{ color: 'var(--ink-soft)' }}>{String(randomV.English).replace(/\*/g, '')}</p>}
                                {show.ta && randomV.Tamil && <p className="font-tamil text-[15px] leading-loose" style={{ color: 'var(--ink-soft)' }}>{String(randomV.Tamil).replace(/\*/g, '')}</p>}
                                {(randomV.English_Footnote || randomV.Tamil_Footnote) && (
                                    <div className="mt-3 text-[13px] italic leading-relaxed space-y-1.5" style={{ color: 'var(--muted)' }}>
                                        {(show.en || !show.ta) && randomV.English_Footnote && <p className="m-0 whitespace-pre-line verse-en">{String(randomV.English_Footnote).replace(/^\*/, '± ')}</p>}
                                        {show.ta && randomV.Tamil_Footnote && <p className="m-0 whitespace-pre-line font-tamil not-italic">{String(randomV.Tamil_Footnote).replace(/^\*/, '± ')}</p>}
                                    </div>
                                )}
                                <div className="flex gap-2 mt-5">
                                    <button className="flex-1 py-2.5 rounded-full text-sm font-bold cursor-pointer"
                                            style={{ background: 'var(--accent)', color: 'var(--bg-soft)', border: 'none' }}
                                            onClick={() => { const s = Number(randomV.Surah), a = Number(randomV.Ayah); setRandomV(null); goToVerse(s, a); }}>
                                        Read in context
                                    </button>
                                    <button className="lang-pill flex-1 py-2.5 rounded-full text-sm font-bold" onClick={showRandom}>Another</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── Toast ── */}
                    {toast && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] fade-in px-5 py-2.5 rounded-full text-sm font-semibold flex items-center gap-2"
                             style={{ background: 'var(--ink)', color: 'var(--bg)' }}>
                            <Icon d={I.check} size={15} /> {toast}
                        </div>
                    )}

                    {/* ── Footer ── */}
                    <footer className="max-w-5xl mx-auto px-4 mt-16 pt-6 text-center text-xs" style={{ color: 'var(--muted)', borderTop: '1px solid var(--line)' }}>
                        Bayyinah · Quran: The Final Testament — translated by Rashad Khalifa, Ph.D. · with Tamil translation
                        <div className="mt-1">Word-by-word data & root dictionary courtesy of WikiSubmission / Tanzil (CC-BY)</div>
                    </footer>

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
